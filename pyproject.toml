[project]
name = "nova-framework"
version = "0.3.0"
description = "NOVA — multilingual (FR/EN/ES/DE/IT/PT) business-intent DSL and compiler that generates a FastAPI backend (with optional JWT auth and declarative queries), a Reflex UI, Docker images and Kubernetes manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - ENC-SOFT" }
authors = [{ name = "ENC-SOFT" }]
dependencies = [
    "lark>=1.1",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
runtime = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlmodel>=0.0.16",
    "reflex>=0.5",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nova = "nova_compiler.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nova_compiler*"]
